[project]
name = "retrieval-augmented-generation"
version = "0.1.0"
description = "Production-grade agentic RAG for the defence sector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "guardrails-ai>=0.11.0",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "portkey-ai>=2.3.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defence_rag"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
