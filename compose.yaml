services:
  qdrant:
    image: qdrant/qdrant:v1.15.2
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    container_name: defence-rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/eval:/app/data/eval
      - ./data/runtime:/app/data/runtime
    restart: unless-stopped

volumes:
  qdrant_storage: